<section class="panel">
  <span class="eyebrow">01 / VOTRE FORMATION</span>
  <h3>Une nouvelle idée à transmettre</h3>
  <p class="muted">
    Tous les champs sont obligatoires. Votre formation sera enregistrée en brouillon.
  </p>
  <form #formationForm="ngForm" (ngSubmit)="enregistrer.emit()">
    <fieldset [disabled]="charge">
      <label for="titre">Titre</label
      ><input
        id="titre"
        name="titre"
        [(ngModel)]="formulaire.titre"
        required
        maxlength="200"
        placeholder="Ex. Les fondamentaux de Node.js"
      />
      <label for="description">Description</label
      ><textarea
        id="description"
        name="description"
        [(ngModel)]="formulaire.description"
        required
        maxlength="10000"
        rows="5"
        placeholder="Que vont apprendre vos apprenants ?"
      ></textarea>
      <div class="two-cols">
        <div>
          <label for="categories">Catégories</label
          ><input
            id="categories"
            name="categories"
            [(ngModel)]="formulaire.categories"
            required
            maxlength="800"
            placeholder="Développement web, JavaScript"
          /><small>Séparez les catégories par une virgule.</small>
        </div>
        <div>
          <label for="prix">Prix en TND</label
          ><input
            id="prix"
            name="prix"
            type="number"
            [(ngModel)]="formulaire.prix"
            required
            min="0"
            max="1000000"
            step="0.01"
          /><small>0 pour une formation gratuite.</small>
        </div>
      </div>
      <label for="image">Image de couverture</label
      ><input
        id="image"
        type="file"
        [accept]="formatsImage"
        (change)="imageChoisie.emit($event)"
        required
      /><small>JPG, PNG, WebP ou GIF · 50 Mo maximum.</small>
      <div class="actions">
        <button type="submit" [disabled]="formationForm.invalid || !image">
          Créer la formation
        </button>
      </div>
    </fieldset>
  </form>
</section>
