name: Backend CI/CD

on:
  push:
    branches: [main]
    paths: ['codeBack/backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['codeBack/backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codeBack/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: codeBack/backend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - name: Keep production dependencies only
        run: npm prune --omit=dev
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: codeBack/backend
          retention-days: 3

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production-api
      url: ${{ vars.AZURE_WEBAPP_URL }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: app
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' ${{ vars.AZURE_WEBAPP_URL }}/health || true)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "Health check failed"; exit 1
      - name: Database check
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o body.json -w '%{http_code}' ${{ vars.AZURE_WEBAPP_URL }}/health/db || true)
            echo "attempt $i -> $code $(cat body.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "Database check failed: check MONGODB_URI in Azure and run npm run db:init"; exit 1
