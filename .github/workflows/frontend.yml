name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths: ['codeFront/frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['codeFront/frontend/**', '.github/workflows/frontend.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codeFront/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codeFront/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npx ng test --watch=false
        if: ${{ vars.RUN_FRONT_TESTS == 'true' }}
      - name: Build
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"
      - name: Locate build output and add SPA fallback
        id: out
        run: |
          dir=$(dirname "$(find dist -name index.html | head -n1)")
          echo "dir=codeFront/frontend/$dir" >> "$GITHUB_OUTPUT"
          cp "$dir/index.html" "$dir/404.html"
          touch "$dir/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
