<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6C3CF5">
<title>CapSavoir — Prototype interactif</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--primary:#6C3CF5;--primary-dark:#5122d4;--lav:#eee9ff;--bg:#f7f8fc;--white:#fff;--ink:#202438;--muted:#70778b;--border:#e6e8f1;--green:#00a884;--red:#e5484d;--orange:#f3a73e;--shadow:0 10px 35px rgba(38,34,72,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #bda9ff;outline-offset:3px}.app{min-height:100vh}.top{height:78px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(24px,5vw,90px);gap:24px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px;font-size:23px;font-weight:800;letter-spacing:-1px;color:var(--primary);cursor:pointer;white-space:nowrap}.brand-icon{background:var(--primary);color:#fff;width:35px;height:35px;display:grid;place-items:center;border-radius:11px;font-size:22px}.top nav{display:flex;align-items:center;gap:28px;color:#4a5061;font-weight:500;font-size:14px}.top nav a:hover,.sidebar a:hover{color:var(--primary)}.actions{display:flex;gap:10px;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 18px;background:var(--primary);border:1px solid var(--primary);color:#fff;border-radius:11px;font-weight:650;font-size:14px;min-height:44px;transition:.2s}.btn:hover{background:var(--primary-dark);transform:translateY(-1px)}.btn.outline{background:#fff;color:var(--primary);border-color:#d9d0ff}.btn.outline:hover{background:var(--lav)}.btn.soft{background:var(--lav);border-color:var(--lav);color:var(--primary)}.btn.dark{background:var(--ink);border-color:var(--ink)}.btn.green{background:var(--green);border-color:var(--green)}.btn.red{background:var(--red);border-color:var(--red)}.btn.small{min-height:36px;padding:7px 13px;font-size:13px}.btn.full{width:100%}.wrap{max-width:1230px;margin:auto;padding:52px 25px 70px}.eyebrow{color:var(--primary);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.h1{font-weight:800;font-size:clamp(29px,3.7vw,45px);line-height:1.18;letter-spacing:-.04em;margin:12px 0}.muted{color:var(--muted)}.lead{font-size:17px;color:var(--muted)}.hero{background:linear-gradient(118deg,#ece5ff,#f5f2ff 64%,#e6eaff);padding:65px;border-radius:25px;position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:80px;top:-13px;font-size:220px;color:rgba(108,60,245,.13)}.hero>*{position:relative;z-index:1;max-width:780px}.hero .h1{font-size:clamp(38px,4.4vw,58px)}.hero p{max-width:630px;font-size:18px;color:#555b72}.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:45px 0 22px}.section-head h2{font-size:25px;letter-spacing:-.03em;margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card,.panel,.stat,.course-card{border:1px solid var(--border);background:#fff;border-radius:18px;box-shadow:var(--shadow)}.card{padding:25px}.course-card{overflow:hidden;display:flex;flex-direction:column}.course-visual{height:145px;background:linear-gradient(135deg,#ece5ff,#dedbff);display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:56px}.course-card:nth-child(2) .course-visual{background:linear-gradient(135deg,#ddf4ff,#e8e5ff)}.course-card:nth-child(3) .course-visual{background:linear-gradient(135deg,#fff0dc,#ffebf0)}.course-card .inside{padding:22px;flex:1;display:flex;flex-direction:column;align-items:flex-start}.course-card h3,.card h3{font-size:19px;line-height:1.35;margin:12px 0 9px}.course-card p{color:var(--muted);font-size:14px;margin:0 0 18px}.course-card .btn{margin-top:auto}.tag{display:inline-block;font-size:12px;color:var(--primary);background:var(--lav);border-radius:99px;padding:5px 11px;font-weight:650}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.space{justify-content:space-between}.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:26px}.panel{padding:30px}.panel h2{margin:0 0 20px;font-size:24px}.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}.field label{font-size:14px;font-weight:650}.input,textarea,select{border:1px solid var(--border);padding:12px 14px;width:100%;border-radius:10px;outline:0;background:#fcfcfe;color:var(--ink);min-height:44px}.input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #6c3cf51b}textarea{min-height:105px;resize:vertical}.auth{max-width:540px;margin:0 auto;background:#fff;padding:42px;border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--border)}.auth h2{font-size:29px;letter-spacing:-.03em;margin:0}.switch{color:var(--primary);font-weight:700;border:0;background:none;padding:5px}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 78px)}.sidebar{background:#fff;border-right:1px solid var(--border);padding:30px 16px}.sidebar .caption{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.13em;padding:0 17px;margin-bottom:20px}.sidebar a{display:flex;align-items:center;gap:12px;border-radius:11px;padding:12px 15px;color:#565d73;font-weight:550;margin:4px 0}.sidebar a.active{background:var(--lav);color:var(--primary);font-weight:700}.dash{padding:35px clamp(22px,3vw,50px) 65px;max-width:1530px;width:100%;margin:auto}.dash-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:34px}.dash h1{font-size:32px;letter-spacing:-.04em;margin:0 0 4px}.dash h2{font-size:24px;margin:0 0 16px;letter-spacing:-.02em}.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:37px}.stat{padding:24px}.stat strong{display:block;font-size:25px;margin-bottom:5px}.progress{width:100%;background:#ebeaf3;height:9px;border-radius:20px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:var(--primary);border-radius:20px}.list-row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 0;border-bottom:1px solid var(--border)}.list-row:last-child{border-bottom:0}.list-row strong{display:block;margin-bottom:4px}.list-row small{color:var(--muted)}.video{background:radial-gradient(circle at 50% 40%,#4e536b,#202438);border-radius:19px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#fff}.play{width:86px;height:86px;border:0;border-radius:50%;background:#ffffff26;color:#fff;font-size:32px}.option{width:100%;text-align:left;padding:15px 20px;margin:8px 0;background:#fff;border:1px solid var(--border);border-radius:10px;color:var(--ink)}.option:hover,.option.chosen{background:var(--lav);border-color:var(--primary);color:var(--primary)}.option.correct{background:#dffaf1;border-color:var(--green);color:#087d64}.option.incorrect{background:#ffeeef;border-color:var(--red);color:#b02b31}.assistant-modes{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.mode{padding:22px;background:#f7f8fc;border-radius:14px;border:2px solid transparent;cursor:pointer}.mode.active{background:var(--lav);border-color:var(--primary)}.chat{height:300px;overflow:auto;padding:15px;border-radius:12px;background:#f7f8fc;display:flex;flex-direction:column;gap:12px;margin:20px 0}.bubble{max-width:84%;padding:12px 16px;border-radius:13px;background:#fff;align-self:flex-start;white-space:pre-line}.bubble.me{align-self:flex-end;background:var(--primary);color:#fff}.toast{position:fixed;bottom:24px;right:24px;background:#24263c;color:#fff;padding:13px 19px;border-radius:12px;box-shadow:0 12px 35px #0002;z-index:99;max-width:360px;animation:rise .25s ease}.hidden{display:none!important}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.footer{text-align:center;padding:30px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}.pillnav{display:flex;flex-wrap:wrap;gap:7px}.pillnav a{font-size:12px;border:1px solid var(--border);padding:7px 10px;border-radius:9px;background:#fff}.pillnav a:hover{border-color:var(--primary);color:var(--primary)}.check{color:var(--green)}.switcher{position:fixed;bottom:16px;left:16px;z-index:40;background:var(--ink);color:#fff;border-radius:13px;padding:11px;box-shadow:0 8px 25px #0003;font-size:12px}.switcher label{display:block;margin-bottom:6px;color:#c8c8d4}.switcher select{min-height:36px;background:#fff;width:170px;font-size:12px;padding:7px}.filterbar{display:grid;grid-template-columns:1fr 220px 150px;gap:12px;margin:25px 0}.certificate{border:5px double #cbb9ff;border-radius:15px;padding:35px;text-align:center;background:linear-gradient(135deg,#fff,#f7f4ff)}.certificate h2{font-size:35px;margin:10px 0;color:var(--primary)}.certificate h3{font-size:25px}.introbar{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.introbar .tag{padding:8px 13px}.question-head{margin:12px 0 20px}.question-head h3{font-size:21px}.modalbg{position:fixed;inset:0;background:#13142682;z-index:60;display:grid;place-items:center;padding:20px}.modal{width:min(480px,95vw);background:#fff;border-radius:20px;padding:30px;box-shadow:0 30px 80px #0003}.modal h2{margin:0 0 10px}.modal p{color:var(--muted)}@media(max-width:1060px){.grid{grid-template-columns:repeat(2,1fr)}.top nav{display:none}.two{grid-template-columns:1fr}.shell{grid-template-columns:210px minmax(0,1fr)}.hero{padding:40px}}@media(max-width:720px){.top{height:67px;padding:0 16px}.brand{font-size:18px}.top .actions .outline{display:none}.top .btn{font-size:12px;padding:8px 11px}.wrap{padding:29px 15px 55px}.hero{padding:33px 24px}.hero:after{right:-45px;top:15px}.hero .h1{font-size:34px}.grid,.statrow,.assistant-modes{grid-template-columns:1fr}.shell{display:block}.sidebar{padding:10px;display:flex;gap:7px;overflow:auto;white-space:nowrap;border-right:0;border-bottom:1px solid var(--border)}.sidebar .caption{display:none}.sidebar a{padding:8px 11px;font-size:12px;flex-shrink:0}.dash{padding:22px 15px 60px}.dash-header{display:block}.dash-header .btn{margin-top:14px}.dash h1{font-size:26px}.filterbar{grid-template-columns:1fr}.auth{padding:26px}.switcher{bottom:6px;left:6px;padding:7px}.switcher select{width:135px}.section-head{align-items:flex-start}.panel{padding:20px}}
</style>
</head>
<body><div id="app" class="app"></div><div id="switcher" class="switcher"><label for="quick-route">Navigation maquettes · 14 écrans</label><select id="quick-route" aria-label="Aller à une maquette"></select></div><div id="toast-root"></div><script>
const courses=[{id:'python',name:'Python & Data',icon:'⌘',category:'Data',level:'Débutant',hours:'12 heures',chapters:8,desc:'Maîtrisez Python, Pandas et la visualisation de données à travers des projets concrets.',progress:62},{id:'web',name:'Développement Web',icon:'⌨',category:'Web',level:'Intermédiaire',hours:'18 heures',chapters:12,desc:'Créez des applications modernes et interactives en HTML, CSS, JavaScript et API.',progress:71},{id:'design',name:'Design UI/UX',icon:'✦',category:'Design',level:'Débutant',hours:'9 heures',chapters:6,desc:'Concevez des interfaces intuitives et professionnelles en suivant les bonnes pratiques UX.',progress:28}];
const screens=[['home','Accueil public'],['catalog','Catalogue'],['detail','Fiche formation'],['auth','Connexion / inscription'],['student','Dashboard apprenant'],['player','Lecteur de cours'],['quiz','Quiz et résultats'],['ai','Assistant IA'],['trainer','Dashboard formateur'],['editor','Éditeur de formation'],['agent','Dashboard agent'],['review','Validation de formation'],['verify','Vérification certificat'],['payment','Paiement simulé']];
const state={route:'home',course:'python',authMode:'register',role:'visiteur',logged:false,enrolled:false,payment:false,quizStep:0,quizAnswers:{},quizDone:false,aiMode:'comprendre',messages:[],trainerSent:false,moderation:'En attente',certValid:false,filter:'Tous',search:'',editTitle:'',editDesc:'',chapter:3};
const quiz=[{q:'Quelle fonction affiche les premières lignes d’un DataFrame ?',opts:['df.first()','df.head()','df.top()','df.begin()'],ans:1,ex:'La méthode head() retourne par défaut les 5 premières lignes.'},{q:'Quel type de données Python est modifiable ?',opts:['Tuple','String','Liste','Entier'],ans:2,ex:'Une liste est mutable : on peut modifier ses éléments.'},{q:'Quelle bibliothèque est utilisée pour les DataFrames ?',opts:['Pandas','Flask','Pygame','Requests'],ans:0,ex:'Pandas fournit la structure DataFrame et les outils de traitement.'}];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,style='')=>`<button class="btn ${style}" data-action="${esc(action)}">${label}</button>`;
const tag=s=>`<span class="tag">${esc(s)}</span>`;
function toast(message){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(message)}</div>`;setTimeout(()=>{root.innerHTML=''},3600)}
function go(route){state.route=route;window.location.hash=route;render();window.scrollTo({top:0,behavior:'instant'})}
function header(){return `<header class="top"><div class="brand" data-action="go:home"><span class="brand-icon">◈</span>CapSavoir</div><nav><a href="#catalog">Formations</a><a href="#home" data-action="how">Comment ça marche</a><a href="#verify">Certificats</a></nav><div class="actions">${btn('Mon espace','go:'+({formateur:'trainer',agent:'agent',apprenant:'student'}[state.role]||'auth'),'outline')}${btn(state.logged?'Profil':'Connexion','go:auth')}</div></header>`}
function shell(title,subtitle,role,items,content,extra=''){return `${header()}<div class="shell"><aside class="sidebar"><div class="caption">ESPACE ${role.toUpperCase()}</div>${items.map(([r,l,i])=>`<a href="#${r}" class="${state.route===r?'active':''}"><span>${i}</span>${l}</a>`).join('')}</aside><main class="dash"><div class="dash-header"><div><h1>${title}</h1><p class="muted" style="margin:0">${subtitle}</p></div>${extra}</div>${content}</main></div>`}
const learnMenu=[['student','Tableau de bord','▦'],['catalog','Mes formations','▤'],['verify','Certificats','◇'],['ai','Assistant IA','✧'],['auth','Mon profil','◉']];
const trainMenu=[['trainer','Tableau de bord','▦'],['trainer','Mes formations','▤'],['editor','Créer une formation','＋'],['quiz','Quiz et examens','✎'],['trainer','Statistiques','◴']];
const agentMenu=[['agent','Tableau de bord','▦'],['review','Candidatures','♧'],['review','Formations à valider','✓'],['review','Modifications','✎'],['agent','Historique','◴']];
function card(c,detail=true){return `<article class="course-card"><div class="course-visual">${c.icon}</div><div class="inside">${tag(c.category+' · '+c.level)}<h3>${esc(c.name)}</h3><p>${esc(c.desc)}</p><p><strong>${c.hours}</strong> · ${c.chapters} chapitres</p>${btn(detail?'Découvrir la formation':'Reprendre le cours',detail?'detail:'+c.id:'play:'+c.id)}</div></article>`}
function home(){return header()+`<main class="wrap"><section class="hero"><div class="eyebrow">Apprendre sans limites</div><h1 class="h1">Apprenez aujourd'hui.<br>Évoluez demain.</h1><p>Une plateforme de formation interactive avec des cours structurés, des quiz, des certificats et un assistant IA pour progresser à votre rythme.</p><div class="hero-actions">${btn('Explorer les formations','go:catalog')}${btn('Créer mon compte','register','outline')}</div></section><div class="section-head"><h2>Formations populaires</h2><a href="#catalog" style="color:var(--primary);font-weight:700">Voir le catalogue →</a></div><div class="grid">${courses.map(c=>card(c)).join('')}</div><div class="section-head"><h2>Pourquoi CapSavoir ?</h2></div><div class="grid"><div class="card"><h3>◈ Parcours organisés</h3><p class="muted">Progressez chapitre après chapitre, avec vos ressources au même endroit.</p></div><div class="card"><h3>✧ Assistant IA</h3><p class="muted">Posez vos questions ou entraînez-vous avec des indices pédagogiques.</p></div><div class="card"><h3>◇ Certificats</h3><p class="muted">Validez vos acquis et partagez un certificat vérifiable.</p></div></div></main>${footer()}`}
function catalog(){let list=courses.filter(c=>(state.filter==='Tous'||c.category===state.filter)&&c.name.toLowerCase().includes(state.search.toLowerCase()));return header()+`<main class="wrap"><div class="eyebrow">Bibliothèque de cours</div><h1 class="h1">Explorez les formations</h1><p class="lead">Recherchez par domaine et trouvez le parcours qui vous correspond.</p><div class="filterbar"><input id="search" class="input" value="${esc(state.search)}" placeholder="⌕  Rechercher une formation..." aria-label="Rechercher"><select id="filter" aria-label="Catégorie">${['Tous','Data','Web','Design'].map(a=>`<option ${a===state.filter?'selected':''}>${a}</option>`).join('')}</select>${btn('Réinitialiser','reset-filters','outline')}</div><div class="grid">${list.length?list.map(c=>card(c)).join(''):'<p>Aucune formation trouvée.</p>'}</div></main>${footer()}`}
function detail(){let c=courses.find(x=>x.id===state.course)||courses[0];return header()+`<main class="wrap"><a href="#catalog" class="muted">← Retour au catalogue</a><div style="margin-top:22px">${tag(c.category+' · '+c.level)}<h1 class="h1">${esc(c.name)}</h1><p class="lead">${esc(c.desc)}</p></div><div class="introbar">${tag('◷ '+c.hours)}${tag('▤ '+c.chapters+' chapitres')}${tag('◇ Certificat inclus')}</div><div class="two"><div class="panel"><h2>Au programme</h2>${['Introduction et découverte','Fondamentaux et concepts','Données et structures','Pandas et manipulation','Visualisation et exercices','Projet pratique','Révisions et quiz','Évaluation finale'].slice(0,c.chapters).map((a,i)=>`<div class="list-row"><div><strong>${String(i+1).padStart(2,'0')} · ${a}</strong><small>Leçon · Exercices · Ressources</small></div><span class="muted">›</span></div>`).join('')}</div><div class="panel" style="align-self:start"><div class="course-visual" style="border-radius:13px;height:150px;margin-bottom:22px">${c.icon}</div><h2>Votre parcours</h2><p class="muted">${c.hours} · ${c.chapters} chapitres · Certificat inclus</p>${btn(state.enrolled?'Continuer la formation':'S’inscrire à la formation',state.enrolled?'go:player':'enroll','full')}<p style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:0">Démo pédagogique · Inscription simulée</p></div></div></main>${footer()}`}
function auth(){return header()+`<main class="wrap"><div class="auth"><div class="eyebrow">Votre espace personnel</div><h2>${state.authMode==='register'?'Créer mon compte':'Heureux de vous revoir'}</h2><p class="muted">${state.authMode==='register'?'Inscrivez-vous pour commencer à apprendre.':'Connectez-vous pour retrouver vos parcours.'}</p><form id="auth-form">${state.authMode==='register'?'<div class="field"><label>Nom complet</label><input required class="input" name="fullname" placeholder="Ex. Amine Ben Ali"></div>':''}<div class="field"><label>Adresse e-mail</label><input type="email" required class="input" name="email" placeholder="exemple@email.com"></div><div class="field"><label>Mot de passe</label><input type="password" minlength="4" required class="input" name="password" placeholder="••••••••"></div><div class="field"><label>Type de compte (démo)</label><select name="role"><option value="apprenant" ${state.role==='apprenant'?'selected':''}>Apprenant</option><option value="formateur" ${state.role==='formateur'?'selected':''}>Formateur</option><option value="agent" ${state.role==='agent'?'selected':''}>Agent / modération</option></select></div><button type="submit" class="btn full">${state.authMode==='register'?'Créer mon compte':'Se connecter'}</button></form><p style="text-align:center;color:var(--muted)">${state.authMode==='register'?'Déjà inscrit ?':'Pas encore de compte ?'} <button class="switch" data-action="toggle-auth">${state.authMode==='register'?'Se connecter':'Créer un compte'}</button></p></div></main>${footer()}`}
function student(){return shell('Bonjour, bienvenue 👋','Continuez votre progression et atteignez vos objectifs.','apprenant',learnMenu,`<div class="statrow"><div class="stat"><strong>3 formations</strong><span class="muted">En cours</span></div><div class="stat"><strong>72 %</strong><span class="muted">Progression moyenne</span></div><div class="stat"><strong>2 certificats</strong><span class="muted">Déjà obtenus</span></div></div><h2>Reprendre l’apprentissage</h2><div class="grid">${courses.map(c=>`<div class="card">${tag(c.category)}<h3>${c.name}</h3><p class="muted">Chapitre ${Math.ceil(c.progress/100*c.chapters)} / ${c.chapters}</p><div class="progress"><div style="width:${c.progress}%"></div></div><p class="muted">${c.progress}% terminé</p>${btn('Reprendre','play:'+c.id)}</div>`).join('')}</div><div class="section-head"><h2>Vos certificats</h2></div><div class="panel"><div class="list-row"><div><strong>Certificat Python & Data</strong><small>CAP-2026-000189 · Émis à titre de démonstration</small></div>${btn('Consulter','certificate','outline')}</div></div>`)}
function player(){let c=courses.find(x=>x.id===state.course)||courses[0];let chapters=['Introduction','Bases et concepts','Structures de données','Pandas et DataFrames','Visualisation','Projet pratique','Révisions','Évaluation finale'];return shell(c.name,`Chapitre ${state.chapter+1} · ${chapters[state.chapter]||'Projet'}`,'apprenant',[['student','Mes formations','▦'],['player','Chapitres','▤'],['quiz','Quiz','✎'],['ai','Assistant IA','✧'],['student','Mes notes','◉']],`<div class="two"><div><div class="video"><button class="play" title="Lire la vidéo de démonstration" data-action="video">▶</button></div><h2 style="margin-top:28px">${chapters[state.chapter]||'Cours'} — introduction</h2><p class="muted">Dans cette leçon, découvrez les concepts clés et mettez-les en pratique avec des exemples simples. Le lecteur vidéo est une démonstration visuelle.</p><div class="row">${btn('✧ Comprendre avec l’IA','go:ai','soft')}${btn('Passer au quiz','go:quiz')}${btn('Chapitre suivant','next-chapter','outline')}</div></div><div class="panel" style="height:max-content"><h2>Plan du cours</h2>${chapters.map((c,i)=>`<div class="list-row"><div><strong style="${i===state.chapter?'color:var(--primary)':''}">${i<state.chapter?'✓':i===state.chapter?'▶':'○'} ${esc(c)}</strong><small>Chapitre ${i+1}</small></div><button class="switch" data-action="chapter:${i}">Voir</button></div>`).join('')}</div></div>`)}
function quizPage(){let q=quiz[state.quizStep];let index=state.quizStep;let ans=state.quizAnswers[index];return shell('Évaluation · Python','Vérifiez votre compréhension.','apprenant',[['student','Mon apprentissage','▦'],['player','Leçon en cours','▶'],['quiz','Quiz','✎'],['ai','Assistant IA','✧']],state.quizDone?`<div class="panel" style="max-width:700px;text-align:center"><div style="font-size:72px">🏆</div><h2>Évaluation terminée</h2><p class="lead">Votre score : <strong>${quiz.filter((q,i)=>q.ans===state.quizAnswers[i]).length}/${quiz.length}</strong> bonnes réponses</p><p class="muted">Vous pouvez réessayer ou continuer vers votre certificat de démonstration.</p><div class="row" style="justify-content:center">${btn('Recommencer','quiz-reset','outline')}${btn('Voir mon certificat','certificate')}</div></div>`:`<div class="two"><div class="panel"><span class="eyebrow">Question ${index+1} sur ${quiz.length}</span><div class="progress"><div style="width:${(index+1)/quiz.length*100}%"></div></div><div class="question-head"><h3>${q.q}</h3></div>${q.opts.map((o,i)=>`<button class="option ${ans===i?'chosen':''}" data-action="answer:${i}">○ &nbsp; ${esc(o)}</button>`).join('')}<div class="row" style="margin-top:24px">${btn(index===quiz.length-1?'Terminer le quiz':'Question suivante','quiz-next')}</div></div><div class="panel" style="height:max-content"><h2>Votre progression</h2><h1 class="h1" style="color:var(--primary)">${String(index+1).padStart(2,'0')} / ${String(quiz.length).padStart(2,'0')}</h1><p class="muted">Choisissez votre réponse avant de continuer.</p></div></div>`)}
function aiPage(){let msgs=state.messages.length?state.messages:[{role:'bot',text:'Bonjour ! Je suis votre assistant pédagogique. Choisissez « Comprendre » ou « Pratiquer », puis posez-moi une question.'}];return shell('Comprendre & pratiquer','Un accompagnement intelligent pendant votre formation.','apprenant',learnMenu,`<div class="panel" style="max-width:1100px"><div class="assistant-modes"><div class="mode ${state.aiMode==='comprendre'?'active':''}" data-action="ai-mode:comprendre"><h3>✦ Comprendre</h3><p class="muted">Explications, résumés et exemples</p></div><div class="mode ${state.aiMode==='pratiquer'?'active':''}" data-action="ai-mode:pratiquer"><h3>✧ Pratiquer</h3><p class="muted">Indices, étapes et corrections</p></div></div><div id="chat" class="chat">${msgs.map(m=>`<div class="bubble ${m.role==='me'?'me':''}">${esc(m.text)}</div>`).join('')}</div><form id="chat-form" class="row"><input class="input" style="flex:1" name="message" placeholder="Posez une question à l'assistant..." required><button class="btn" type="submit">Envoyer →</button></form><p class="muted" style="font-size:12px">Prototype : réponses pédagogiques prédéfinies, sans connexion à un véritable modèle IA.</p></div>`)}
function trainer(){return shell('Espace formateur','Gérez vos contenus et suivez vos apprenants.','formateur',trainMenu,`<div class="statrow"><div class="stat"><strong>6 formations</strong><span class="muted">Créées</span></div><div class="stat"><strong>128 apprenants</strong><span class="muted">Inscriptions</span></div><div class="stat"><strong>${state.trainerSent?'3':'2'} en validation</strong><span class="muted">Décisions en attente</span></div></div><h2>Mes formations</h2><div class="grid"><div class="card">${tag('Publiée')}<h3>Python & Data</h3><p class="muted">80 inscrits</p>${btn('Modifier','go:editor','outline')}</div><div class="card">${tag('En validation')}<h3>UI/UX Essentials</h3><p class="muted">Décision en attente</p>${btn('Voir la demande','go:review','outline')}</div><div class="card">${tag('Brouillon')}<h3>Web moderne</h3><p class="muted">Sauvegardé récemment</p>${btn('Continuer','go:editor')}</div></div>`,btn('+ Nouvelle formation','go:editor'))}
function editor(){return shell('Créer une formation','Renseignez les informations avant l’envoi en validation.','formateur',[['editor','Informations générales','◈'],['editor','Chapitres','▤'],['editor','Ressources','▧'],['quiz','Quiz et examens','✎'],['detail','Prévisualisation','◉']],`<form id="editor-form" class="panel" style="max-width:1020px"><h2>Informations générales</h2><div class="field"><label>Titre de la formation</label><input class="input" name="title" required value="${esc(state.editTitle)}" placeholder="Ex. Python pour débutants"></div><div class="field"><label>Description</label><textarea name="desc" placeholder="Description pédagogique">${esc(state.editDesc)}</textarea></div><div class="field"><label>Catégorie</label><select name="category"><option>Programmation</option><option>Data</option><option>Design</option><option>Business</option></select></div><div class="field"><label>Niveau</label><select name="level"><option>Débutant</option><option>Intermédiaire</option><option>Avancé</option></select></div><div class="field"><label>Objectifs pédagogiques</label><textarea name="goals" placeholder="Ce que les apprenants sauront faire à la fin..."></textarea></div><div class="row" style="justify-content:flex-end"><button type="submit" name="intent" value="draft" class="btn dark">Enregistrer brouillon</button><button type="submit" name="intent" value="submit" class="btn">Soumettre à validation</button></div></form>`)}
function agent(){return shell('Modération & validation','Examinez les demandes et garantissez la qualité.','agent',agentMenu,`<div class="statrow"><div class="stat"><strong>4 candidatures</strong><span class="muted">À examiner</span></div><div class="stat"><strong>${state.trainerSent?8:7} cours</strong><span class="muted">À valider</span></div><div class="stat"><strong>3 modifications</strong><span class="muted">À contrôler</span></div></div><h2>Demandes en attente</h2><div class="panel">${['Nouveau formateur · Ahmed B.','Formation · Python pour débutants','Modification · Web avancé',...(state.trainerSent?['Nouvelle soumission · '+state.editTitle]:[])].map(s=>`<div class="list-row"><div><strong>${esc(s)}</strong><small>Statut : ${state.moderation}</small></div>${btn('Examiner','go:review','outline')}</div>`).join('')}</div>`)}
function review(){return shell('Examiner une formation','Demande #VAL-023 · '+state.moderation,'agent',agentMenu,`<div class="panel" style="max-width:1000px"><h2>${esc(state.editTitle||'Python pour débutants')}</h2><p class="muted">Soumis par : formateur Ahmed B. · 8 chapitres · 12 ressources</p><h3 style="margin-top:35px">Contenu du dossier</h3>${['Description pédagogique','Programme et chapitres','Ressources et quiz','Objectifs d’apprentissage'].map(s=>`<div class="list-row"><strong><span class="check">✓</span> ${s}</strong><span class="muted">Disponible</span></div>`).join('')}<p class="muted">Statut actuel : <strong>${state.moderation}</strong></p><div class="row" style="justify-content:flex-end;margin-top:26px">${btn('Refuser','moderate:Refusée','red')}${btn('Demander modification','moderate:Modification demandée','dark')}${btn('Approuver','moderate:Approuvée','green')}</div></div>`)}
function verify(){return header()+`<main class="wrap"><div class="eyebrow">Authenticité des attestations</div><h1 class="h1">Vérifier un certificat</h1><p class="lead">Confirmez l’authenticité d’une attestation CapSavoir.</p><form id="verify-form" class="panel" style="max-width:740px;margin:35px auto"><div class="field"><label>Code du certificat</label><input class="input" required name="code" placeholder="Ex. CAP-2026-000189" value="CAP-2026-000189"></div><button type="submit" class="btn full">Vérifier le certificat</button>${state.certValid?`<div style="margin-top:25px;padding:22px;border-radius:13px;background:#e1f8ef"><h3 style="margin:0;color:#00886a">✓ Certificat de démonstration vérifié</h3><p>Titulaire : Apprenant Démo · Formation : Python & Data<br>Code : CAP-2026-000189</p></div>`:''}<p class="muted" style="font-size:12px">Le registre de certificats est simulé dans ce prototype.</p></form></main>${footer()}`}
function payment(){return header()+`<main class="wrap"><div class="eyebrow">Inscription à une formation</div><h1 class="h1">Finaliser l’inscription</h1><p class="lead">Simulation de paiement — aucune transaction bancaire réelle.</p><div class="panel" style="max-width:700px;margin:35px auto"><h2>Récapitulatif de commande</h2><div class="list-row"><div><strong>Formation · ${esc(courses.find(x=>x.id===state.course)?.name||'Python & Data')}</strong><small>Accès au parcours et certificat</small></div>${tag('E-learning')}</div><div class="list-row"><strong>Total simulé</strong><strong style="font-size:23px;color:var(--primary)">0,00 DT</strong></div>${btn('Confirmer la simulation','payment-done','full')}<p class="muted" style="text-align:center;font-size:12px">Ce prototype ne collecte ni carte bancaire ni paiement.</p></div></main>${footer()}`}
function footer(){return `<footer class="footer">© CapSavoir · Prototype de démonstration HTML · Données fictives · Aucun backend requis</footer>`}
function certificate(){const html=`<div class="certificate"><div class="eyebrow">Attestation de réussite · Démonstration</div><h2>◈ CapSavoir</h2><p>Ce certificat de démonstration est attribué à</p><h3>Apprenant Démo</h3><p>Pour avoir terminé la formation</p><h3>Python & Data</h3><p><strong>CAP-2026-000189</strong> · 10 novembre 2026</p></div><div class="row" style="justify-content:center;margin-top:25px">${btn('Imprimer / enregistrer en PDF','print')}${btn('Vérifier le code','go:verify','outline')}${btn('Fermer','close-modal','outline')}</div>`;document.body.insertAdjacentHTML('beforeend',`<div class="modalbg" id="modal"><div class="modal" style="width:min(730px,95vw)">${html}</div></div>`)}
const renderers={home,catalog,detail,auth,student,player,quiz:quizPage,ai:aiPage,trainer,editor,agent,review,verify,payment};
function render(){const r=renderers[state.route]||home;document.getElementById('app').innerHTML=r();document.getElementById('quick-route').innerHTML=screens.map(([k,v])=>`<option value="${k}" ${k===state.route?'selected':''}>${esc(v)}</option>`).join('');const chat=document.getElementById('chat');if(chat)chat.scrollTop=chat.scrollHeight;document.title='CapSavoir · '+(screens.find(x=>x[0]===state.route)?.[1]||'Accueil')}
function handle(action){if(!action)return;if(action.startsWith('go:'))return go(action.slice(3));if(action.startsWith('detail:')){state.course=action.slice(7);return go('detail')}if(action.startsWith('play:')){state.course=action.slice(5);return go('player')}if(action.startsWith('chapter:')){state.chapter=Number(action.slice(8));return render()}if(action.startsWith('answer:')){state.quizAnswers[state.quizStep]=Number(action.slice(7));return render()}if(action.startsWith('ai-mode:')){state.aiMode=action.slice(8);state.messages=[];return render()}if(action.startsWith('moderate:')){state.moderation=action.slice(9);toast('Décision enregistrée (simulation) : '+state.moderation);return render()}switch(action){case 'register':state.authMode='register';return go('auth');case 'toggle-auth':state.authMode=state.authMode==='register'?'login':'register';return render();case 'reset-filters':state.search='';state.filter='Tous';return render();case 'enroll':if(!state.logged){state.authMode='register';toast('Créez un compte pour vous inscrire.');return go('auth')}return go('payment');case 'payment-done':state.payment=true;state.enrolled=true;toast('Inscription confirmée ! (simulation)');return go('player');case 'next-chapter':state.chapter=Math.min(state.chapter+1,7);return render();case 'quiz-next':if(state.quizAnswers[state.quizStep]===undefined)return toast('Sélectionnez une réponse.');if(state.quizStep<quiz.length-1){state.quizStep++;return render()}state.quizDone=true;return render();case 'quiz-reset':state.quizStep=0;state.quizAnswers={};state.quizDone=false;return render();case 'certificate':return certificate();case 'close-modal':document.getElementById('modal')?.remove();return;case 'print':return window.print();case 'video':return toast('Lecteur vidéo de démonstration : aucune vidéo intégrée.');case 'how':return toast('Explorez les cours → inscrivez-vous → apprenez → quiz → certificat !');default:return toast('Action de démonstration')}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(t){e.preventDefault();handle(t.dataset.action)}else if(e.target.id==='modal')e.target.remove()});
document.addEventListener('submit',e=>{if(!['auth-form','editor-form','verify-form','chat-form'].includes(e.target.id))return;e.preventDefault();const f=e.target;const data=new FormData(f);if(f.id==='auth-form'){state.role=data.get('role');state.logged=true;toast('Bienvenue ! Compte de démonstration activé.');return go({apprenant:'student',formateur:'trainer',agent:'agent'}[state.role]||'student')}if(f.id==='editor-form'){state.editTitle=data.get('title');state.editDesc=data.get('desc');const intent=e.submitter?.value||'draft';if(intent==='submit'){state.trainerSent=true;state.moderation='En attente';toast('Formation soumise à validation (simulation).');return go('trainer')}return toast('Brouillon enregistré pour cette session.')}if(f.id==='verify-form'){if(String(data.get('code')).trim().toUpperCase()==='CAP-2026-000189'){state.certValid=true;toast('Certificat trouvé (données fictives).')}else{state.certValid=false;toast('Code introuvable dans ce registre de démonstration.')}return render()}if(f.id==='chat-form'){const msg=String(data.get('message')).trim();if(!msg)return;state.messages.push({role:'me',text:msg});state.messages.push({role:'bot',text:state.aiMode==='comprendre'?'Voici une explication simple : en Python, une liste [1, 2] peut être modifiée, tandis qu’un tuple (1, 2) est immuable. Vous pouvez aussi revoir les exemples du chapitre.':'Essayez de résoudre le problème en trois étapes : 1) identifiez les données, 2) choisissez une structure Python, 3) testez avec un petit exemple. Indice : pensez à df.head() pour explorer un DataFrame.'});return render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;const p=e.target.selectionStart;render();const a=document.getElementById('search');a?.focus();a?.setSelectionRange(p,p)}});document.addEventListener('change',e=>{if(e.target.id==='quick-route')go(e.target.value);if(e.target.id==='filter'){state.filter=e.target.value;render()}});window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(renderers[r]&&r!==state.route){state.route=r;render()}});state.route=renderers[location.hash.slice(1)]?location.hash.slice(1):'home';render();
</script></body></html>
